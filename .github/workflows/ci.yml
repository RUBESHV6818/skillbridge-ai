name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            skillbridge-backend/package-lock.json
            skillbridge-frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: skillbridge-backend

      - name: Check backend JavaScript syntax
        run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
        working-directory: skillbridge-backend

      - name: Run backend unit checks
        run: npm test
        working-directory: skillbridge-backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: skillbridge-frontend

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid
        working-directory: skillbridge-frontend
